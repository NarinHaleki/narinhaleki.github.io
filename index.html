const D={"en": {"role": "Mechanical & Energy Engineer", "loc": "Turin, Italy · Open to relocation · Born: 1997", "summary": "Mechanical and Energy Engineer with research and industrial experience in dynamic system modeling, and simulation of mechanical and thermal components. Experienced in system integration, technical benchmarking, and techno-economic analysis. Skilled in MATLAB/Simulink, mechanical design, and technical drawing using SolidWorks and AutoCAD, with a strong foundation in thermodynamics, heat transfer, and fluid mechanics.", "labels": ["Professional summary", "Download CV", "Professional experience", "Education", "Academic projects", "Technical skills", "Languages", "Interests & hobbies", "References"], "exp": [["Research Fellow – Thermal Systems & Digital Twin Modelling", "Politecnico di Torino · FC-AERO | Turin, Italy · Jan 2026 – Aug 2026", ["Developed a dynamic MATLAB/Simulink digital twin of a 122.4 kW PEM fuel-cell aircraft propulsion system, integrating stack and major balance-of-plant subsystems.", "Modelled compressors, intercoolers, heat exchangers, fluid supply and cooling circuits using component performance data.", "Analysed waste heat recovery for liquid hydrogen vaporisation and thermal integration.", "Extended the modelling architecture towards 2 MW and assessed component sizing and mission-level system performance.", "Implemented control approaches for power tracking and thermal management."]], ["Internship & Master’s Thesis – System Integration", "Dumarey Automotive Italia | Turin, Italy · Oct 2024 – Oct 2025", ["Benchmarked fuel-cell genset architectures, mechanical and thermal subsystems and hydrogen supply solutions.", "Compared balance-of-plant components, ventilation and safety devices to support preliminary engineering.", "Organised regulations, codes and standards for marine and stationary applications, including hydrogen safety, storage and distribution.", "Contributed to technical documentation and techno-economic analysis."]], ["Research Assistant – UROP", "Politecnico di Torino | Turin, Italy · Mar 2025 – Jul 2025", ["Investigated machine learning for uncertainty analysis in life-cycle assessment of fuels and propulsion systems in public transport.", "Collected and reviewed life-cycle and emissions data to support environmental performance comparisons."]], ["Mechanical Engineering Intern", "Petrochemical Company of Kurdistan | Iran · May 2018 – Jul 2018", ["Supported inspection and maintenance of pumps, compressors, heat exchangers, pressure vessels and valves.", "Worked with P&IDs and followed industrial HSE procedures."]]], "edu": [["MSc in Energy and Nuclear Engineering – Renewable Energy", "Politecnico di Torino | Italy · Sep 2022 – Oct 2025"], ["BSc in Mechanical Engineering", "University of Kurdistan | Sanandaj, Iran · Sep 2016 – Feb 2021"]], "projects": [["HVAC System Design", "University of Kurdistan | Iran", "Calculated heating and cooling loads for an 888 m² four-storey residential building and sized boilers, chillers, cooling towers, fan coils and pumps."], ["District Heating Network Design & Hydraulic Analysis", "Politecnico di Torino | Energy Networks · 2024–2025", "Designed a district heating distribution network for a Turin neighbourhood, focusing on pipe sizing, pressure losses, pumping costs and heat exchanger substations. Studied operation with a groundwater heat pump at reduced supply temperature."], ["Mechanical Design & Engineering Drawing – SolidWorks", "University of Kurdistan | Iran", "Academic training in 3D modelling of mechanical components and technical engineering drawings using SolidWorks."], ["Multi-Zone Thermal Energy Storage", "Politecnico di Torino | MATLAB/Simscape", "Modelled a water-based thermal storage system, including transient temperatures, heat losses and state of charge."], ["Compressed Air Energy Storage (CAES) – Thermal Design and Optimization", "Politecnico di Torino | Aspen Plus", "Modelled a multi-stage compressor, intercooler and turbine system and performed thermodynamic, exergy and exergo-economic analyses to evaluate component losses and operating conditions."], ["Combined Cycle Power Plant Simulation", "University of Kurdistan | Iran", "Modelled a combined-cycle power plant and analysed thermodynamic performance and energy efficiency."], ["CFD & Fluid Dynamics", "University of Kurdistan | Iran", "Academic 2D and 3D fluid-flow simulation work."], ["Solar Domestic Hot Water System", "Politecnico di Torino | Polysun", "Sized the storage tank to meet hot water demand and compared system configurations using NPV and payback."], ["Energy Communities & Vehicle-to-Grid", "Politecnico di Torino | Iren Challenge", "Assessed rooftop PV and V2G electric vehicles in an energy community and estimated revenue and payback."], ["Electricity Transmission Network Modelling – AC Power Flow", "Politecnico di Torino | Energy Networks · PowerWorld Simulator", "Group project on steady-state AC power-flow modelling of a 49-bus, 380 kV transmission network, with a focus on operational adequacy, security and network reinforcement."], ["Floating Offshore Wind Turbine", "Politecnico di Torino", "Studied the dynamic behaviour of floating offshore wind energy systems."], ["Wind Farm Repowering", "Academic project", "Studied wind farm repowering as an approach to upgrading existing wind energy installations."], ["Techno-Economic Evaluation of a Biogas-Fed Solid Oxide Fuel Cell (SOFC) System", "Academic project", "Evaluated the technical and economic aspects of a biogas-fed solid oxide fuel cell system."], ["Alkaline Fuel Cell Simulation – Bachelor’s Thesis", "University of Kurdistan | MATLAB/EES", "Modelled an alkaline fuel cell and coupled MATLAB with EES for thermodynamic property calculations."]], "skills": [["Simulation & modelling", "MATLAB · Simulink · Simscape · EES · Aspen Plus (academic) · Polysun"], ["Mechanical & thermal engineering", "Thermodynamics · Heat transfer · Fluid mechanics · HVAC sizing · Heat exchangers · Compressors · Thermal management"], ["Design & analysis", "SolidWorks (academic) · Technical drawings · P&IDs · System integration · PID control · Technical benchmarking"], ["Programming & data", "Python (basic) · Regression · Performance maps · LCA methods"]], "langs": ["English — C2", "Italian — B1"], "hobby": "Playing guitar · 3D origami · Gym", "refs": "References and contact details available upon request.", "photo": "Photo to be added", "cvnote": "English CV — final version | Italian CV — final version.", "pdfprojects": ["Heating and cooling load calculations and HVAC equipment sizing for an 888 m² building.", "3D modelling of mechanical components and technical drawing using SolidWorks (academic).", "Thermodynamic modelling and performance analysis of a combined-cycle power plant.", "Dynamic modelling of a multi-zone water-based thermal storage system."], "refnames": ["Massimo Santarelli", "Vincenzo Verdino", "Reza Beigzadeh"]}, "it": {"role": "Ingegnera meccanica ed energetica", "loc": "Torino, Italia · Disponibile al trasferimento · Anno di nascita: 1997", "summary": "Ingegnera meccanica ed energetica con esperienza di ricerca e industriale nella modellazione dinamica di sistemi e nella simulazione di componenti meccanici e termici. Esperienza nell’integrazione di sistemi, nel benchmarking tecnico e nell’analisi tecnico-economica. Competenze in MATLAB/Simulink, progettazione meccanica e disegno tecnico con SolidWorks e AutoCAD, con solide basi di termodinamica, trasmissione del calore e fluidodinamica.", "labels": ["Profilo professionale", "Scarica il CV", "Esperienza professionale", "Formazione", "Progetti accademici", "Competenze tecniche", "Lingue", "Interessi e hobby", "Referenze"], "exp": [["Assegnista di ricerca – Sistemi termici e digital twin", "Politecnico di Torino · FC-AERO | Torino, Italia · gen 2026 – ago 2026", ["Sviluppo di un digital twin dinamico MATLAB/Simulink di un sistema di propulsione aeronautica a celle a combustibile PEM da 122,4 kW, integrando lo stack e i principali sottosistemi ausiliari.", "Modellazione di compressori, intercooler, scambiatori di calore, circuiti di alimentazione e raffreddamento sulla base di dati prestazionali.", "Analisi del recupero del calore residuo per la vaporizzazione dell’idrogeno liquido e dell’integrazione termica.", "Estensione dell’architettura di modellazione verso 2 MW e valutazione del dimensionamento dei componenti e delle prestazioni durante la missione.", "Implementazione di strategie di controllo per l’inseguimento della potenza e la gestione termica."]], ["Tirocinio e tesi magistrale – Integrazione di sistemi", "Dumarey Automotive Italia | Torino, Italia · ott 2024 – ott 2025", ["Benchmarking di architetture di gruppi elettrogeni a celle a combustibile, sottosistemi meccanici e termici e soluzioni di alimentazione dell’idrogeno.", "Confronto dei componenti ausiliari, della ventilazione e dei dispositivi di sicurezza a supporto della progettazione preliminare.", "Organizzazione di regolamenti, codici e norme per applicazioni navali e stazionarie, inclusi sicurezza, stoccaggio e distribuzione dell’idrogeno.", "Contributo alla documentazione tecnica e all’analisi tecnico-economica."]], ["Assistente di ricerca – UROP", "Politecnico di Torino | Torino, Italia · mar 2025 – lug 2025", ["Studio di metodi di machine learning per l’analisi dell’incertezza nella valutazione del ciclo di vita di combustibili e sistemi di propulsione per il trasporto pubblico.", "Raccolta e revisione di dati sul ciclo di vita e sulle emissioni per confrontare le prestazioni ambientali."]], ["Tirocinio in ingegneria meccanica", "Petrochemical Company of Kurdistan | Iran · mag 2018 – lug 2018", ["Supporto alle attività di ispezione e manutenzione di pompe, compressori, scambiatori di calore, recipienti in pressione e valvole.", "Consultazione di P&ID e rispetto delle procedure HSE industriali."]]], "edu": [["Laurea magistrale in Ingegneria energetica e nucleare – Energie rinnovabili", "Politecnico di Torino | Italia · set 2022 – ott 2025"], ["Laurea in Ingegneria meccanica", "University of Kurdistan | Sanandaj, Iran · set 2016 – feb 2021"]], "projects": [["Progettazione di impianti HVAC", "University of Kurdistan | Iran", "Calcolo dei carichi termici estivi e invernali di un edificio residenziale di quattro piani (888 m²) e dimensionamento di caldaie, chiller, torri evaporative, ventilconvettori e pompe."], ["Progettazione di reti di teleriscaldamento e analisi idraulica", "Politecnico di Torino | Energy Networks · 2024–2025", "Progettazione di una rete di distribuzione del teleriscaldamento per un quartiere di Torino, con dimensionamento delle tubazioni, perdite di carico, costi di pompaggio e sottostazioni con scambiatori di calore. Studio del funzionamento con pompa di calore ad acqua di falda a temperatura di mandata ridotta."], ["Progettazione meccanica e disegno tecnico – SolidWorks", "University of Kurdistan | Iran", "Formazione accademica nella modellazione 3D di componenti meccanici e nella realizzazione di disegni tecnici con SolidWorks."], ["Accumulo termico multizona", "Politecnico di Torino | MATLAB/Simscape", "Modellazione di un sistema di accumulo termico ad acqua, con analisi delle temperature transitorie, delle dispersioni e dello stato di carica."], ["Accumulo di energia ad aria compressa (CAES) – Progettazione e ottimizzazione termica", "Politecnico di Torino | Aspen Plus", "Modellazione di un sistema multistadio con compressori, intercooler e turbine; analisi termodinamica, exergetica ed exergoeconomica delle perdite dei componenti e delle condizioni operative."], ["Simulazione di una centrale a ciclo combinato", "University of Kurdistan | Iran", "Modellazione di una centrale a ciclo combinato e analisi delle prestazioni termodinamiche e dell’efficienza energetica."], ["CFD e fluidodinamica", "University of Kurdistan | Iran", "Attività accademica di simulazione fluidodinamica 2D e 3D."], ["Solare termico per acqua calda sanitaria", "Politecnico di Torino | Polysun", "Dimensionamento del serbatoio di accumulo e confronto delle configurazioni tramite VAN e tempo di ritorno."], ["Comunità energetiche e Vehicle-to-Grid", "Politecnico di Torino | Iren Challenge", "Valutazione del fotovoltaico sui tetti e dei veicoli elettrici V2G in una comunità energetica, con stima di ricavi e tempi di ritorno."], ["Modellazione della rete elettrica di trasmissione – Load flow AC", "Politecnico di Torino | Energy Networks · PowerWorld Simulator", "Progetto di gruppo sulla modellazione del flusso di potenza AC in regime stazionario di una rete di trasmissione a 380 kV con 49 nodi, con particolare attenzione ad adeguatezza, sicurezza operativa e potenziamento della rete."], ["Turbina eolica offshore galleggiante", "Politecnico di Torino", "Studio del comportamento dinamico dei sistemi eolici offshore galleggianti."], ["Repowering di un parco eolico", "Progetto accademico", "Studio del repowering di un parco eolico come strategia di ammodernamento degli impianti eolici esistenti."], ["Valutazione tecnico-economica di un sistema SOFC alimentato a biogas", "Progetto accademico", "Valutazione degli aspetti tecnici ed economici di un sistema a celle a combustibile a ossidi solidi alimentato a biogas."], ["Simulazione di una cella a combustibile alcalina – Tesi di laurea", "University of Kurdistan | MATLAB/EES", "Modellazione di una cella a combustibile alcalina e collegamento MATLAB-EES per il calcolo delle proprietà termodinamiche."]], "skills": [["Simulazione e modellazione", "MATLAB · Simulink · Simscape · EES · Aspen Plus (accademico) · Polysun"], ["Ingegneria meccanica e termica", "Termodinamica · Trasmissione del calore · Fluidodinamica · Dimensionamento HVAC · Scambiatori di calore · Compressori · Gestione termica"], ["Progettazione e analisi", "SolidWorks (accademico) · Disegno tecnico · P&ID · Integrazione di sistemi · Controllo PID · Benchmarking tecnico"], ["Programmazione e dati", "Python (ba function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sec(title,body){return `<section><h2>${esc(title)}</h2>${body}</section>`}
function detail(title,meta,body){return `<details><summary><span>${esc(title)}<span class="meta">${esc(meta)}</span></span></summary>${body}</details>`}
function downloadCV(l){const raw=atob(pdfs[l]);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download='Narin_Haleki_CV_'+l.toUpperCase()+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function render(l){const d=D[l],a=d.labels;document.documentElement.lang=l;document.getElementById('en').classList.toggle('active',l==='en');document.getElementById('it').classList.toggle('active',l==='it');for(const x of ['role','loc'])document.getElementById(x).textContent=d[x];document.getElementById('photoText').textContent=d.photo;document.getElementById('main').innerHTML=sec(a[0],`<p>${esc(d.summary)}</p>`)+sec(a[1],`<div class="downloads"><a class="download" href="Narin_Haleki_CV_EN.pdf" onclick="event.preventDefault();downloadCV('en')">↓ English CV<small>PDF</small></a><a class="download" href="Narin_Haleki_CV_IT.pdf" onclick="event.preventDefault();downloadCV('it')">↓ CV Italiano<small>PDF</small></a></div><p class="muted" style="margin-top:9px">${esc(d.cvnote)}</p>`)+sec(a[2],d.exp.map(e=>detail(e[0],e[1],'<ul>'+e[2].map(b=>`<li>${esc(b)}</li>`).join('')+'</ul>')).join(''))+sec(a[3],d.edu.map(e=>`<div class="education"><strong>${esc(e[0])}</strong><span class="meta">${esc(e[1])}</span></div>`).join(''))+sec(a[4],d.projects.map(e=>detail(e[0],e[1],`<p>${esc(e[2])}</p>`)).join(''))+sec(a[5],d.skills.map(e=>`<div class="skill"><strong>${esc(e[0])}</strong><p>${esc(e[1])}</p></div>`).join(''))+sec(a[6],d.langs.map(x=>`<p>${esc(x)}</p>`).join(''))+sec(a[7],`<p class="muted">${esc(d.hobby)}</p>`)+sec(a[8],d.refnames.map(n=>`<p><strong>${esc(n)}</strong></p>`).join('')+`<p class="muted" style="margin-top:10px">${esc(d.refs)}</p>`)+`<p class="footer">Narin Haleki · Engineering portfolio</p>`}render('en');</script></body></html>
